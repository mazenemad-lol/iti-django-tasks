{% extends "base.html" %}

{% block title %}تعديل المهمة - {{ task.title }}{% endblock %}

{% block content %}
<div class="card">
    <h2>✏️ تعديل بيانات المهمة (Update Database Record)</h2>
    <form action="{% url 'app2:edit_task' task.id %}" method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_title">عنوان المهمة:</label>
            {{ form.title }}
        </div>
        <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem; margin-top: 1rem;">
            {{ form.is_completed }}
            <label for="id_is_completed" style="margin-bottom: 0; cursor: pointer;">تم إنجاز المهمة (Completed)</label>
        </div>
        <div style="display: flex; gap: 0.75rem; align-items: center; margin-top: 1.5rem;">
            <button type="submit" class="btn">💾 حفظ التعديلات في قاعدة البيانات</button>
            <a href="{% url 'app2:home' %}" class="btn btn-secondary">إلغاء والعودة</a>
        </div>
    </form>
</div>
{% endblock %}
