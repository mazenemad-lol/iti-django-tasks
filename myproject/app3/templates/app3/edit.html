{% extends "base.html" %}

{% block title %}تعديل جهة الاتصال - {{ contact.name }}{% endblock %}

{% block content %}
<div class="card">
    <h2>✏️ تعديل بيانات جهة الاتصال (Update Database Record)</h2>
    <form action="{% url 'app3:edit_contact' contact.id %}" method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_name">الاسم:</label>
            {{ form.name }}
        </div>
        <div class="form-group">
            <label for="id_email">البريد الإلكتروني:</label>
            {{ form.email }}
        </div>
        <div class="form-group">
            <label for="id_phone">رقم الهاتف:</label>
            {{ form.phone }}
        </div>
        <div class="form-group">
            <label for="id_notes">ملاحظات إضافية:</label>
            {{ form.notes }}
        </div>
        <div style="display: flex; gap: 0.75rem; align-items: center; margin-top: 1.5rem;">
            <button type="submit" class="btn">💾 حفظ التعديلات في قاعدة البيانات</button>
            <a href="{% url 'app3:home' %}" class="btn btn-secondary">إلغاء والعودة</a>
        </div>
    </form>
</div>
{% endblock %}
