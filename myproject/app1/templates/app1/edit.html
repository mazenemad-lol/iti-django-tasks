{% extends "base.html" %}

{% block title %}تعديل المقال - {{ article.title }}{% endblock %}

{% block content %}
<div class="card">
    <h2>✏️ تعديل المقال (Update Database Record)</h2>
    <form action="{% url 'app1:edit_article' article.id %}" method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_title">عنوان المقال:</label>
            {{ form.title }}
        </div>
        <div class="form-group">
            <label for="id_content">محتوى المقال:</label>
            {{ form.content }}
        </div>
        <div style="display: flex; gap: 0.75rem; align-items: center; margin-top: 1rem;">
            <button type="submit" class="btn">💾 حفظ التعديلات في قاعدة البيانات</button>
            <a href="{% url 'app1:home' %}" class="btn btn-secondary">إلغاء والعودة</a>
        </div>
    </form>
</div>
{% endblock %}
